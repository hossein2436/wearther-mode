services:
  web:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: wearther-mode-web:latest
    container_name: wearther-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data     # HTTPS certificates live here, keep this volume
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
